<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Bleach</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ff6a00; --spark: #ffcf8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #050510; color: #f5f5f5;
      min-height: 100vh; display: flex;
      justify-content: center; align-items: center;
      padding: 20px; overflow-x: hidden;
    }
    #scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
    .layer.aktif { opacity: 1; }
    .kanji {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 45vw; font-weight: 900; color: #fff; opacity: 0.06; white-space: nowrap;
    }
    .orb { position: absolute; top: 9%; right: 10%; width: clamp(120px, 22vw, 260px); aspect-ratio: 1; border-radius: 50%; }
    .city { position: absolute; bottom: 0; left: 0; width: 100%; height: 36vh; }
    #sparks { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute; bottom: -10px; border-radius: 50%;
      background: var(--spark); box-shadow: 0 0 8px var(--spark);
      opacity: 0; animation: naik linear infinite;
    }
    @keyframes naik {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.9; }
      100% { transform: translateY(-105vh) translateX(40px); opacity: 0; }
    }

    .box {
      position: relative; z-index: 1;
      background: rgba(8,8,18,0.85); backdrop-filter: blur(4px);
      border-left: 8px solid var(--accent);
      width: 100%; max-width: 380px; padding: 24px 20px;
      transition: border-color 1s;
    }
    h1 { font-family: 'Anton', Impact, sans-serif; font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
    h1 span { color: var(--accent); transition: color 1s; }
    .lokasi {
      font-family: 'Anton', Impact, sans-serif; letter-spacing: 3px; font-size: 13px;
      color: var(--accent); margin: 2px 0 14px; text-transform: uppercase; transition: color 1s;
    }
    .layar { background: rgba(0,0,0,0.55); border: 2px solid #f5f5f5; padding: 12px 14px; margin-bottom: 14px; text-align: right; min-height: 92px; }
    #riwayat { font-size: 14px; opacity: 0.6; min-height: 20px; word-break: break-all; }
    #hasil { font-family: 'Anton', Impact, sans-serif; font-size: 40px; letter-spacing: 1px; word-break: break-all; margin-top: 6px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button {
      font-family: 'Anton', Impact, sans-serif; font-size: 22px; letter-spacing: 1px;
      padding: 14px 0; cursor: pointer; color: #f5f5f5;
      background: rgba(255,255,255,0.08); border: 2px solid #f5f5f5; transition: all 0.15s;
    }
    button:hover { background: #f5f5f5; color: #000; transform: translateY(-2px); }
    button.op { border-color: var(--accent); color: var(--accent); }
    button.op:hover { background: var(--accent); color: #000; }
    button.sama { background: var(--accent); border-color: var(--accent); color: #000; grid-column: span 2; transition: all 0.15s, background 1s; }
    button.sama:hover { background: #fff; border-color: #fff; }
    button.hapus { border-color: #ff4d4d; color: #ff4d4d; }
    button.hapus:hover { background: #ff4d4d; color: #000; }
    .pesan { margin-top: 12px; font-size: 12px; letter-spacing: 1px; text-align: center; opacity: 0.7; min-height: 16px; }
  </style>
</head>
<body>

  <div id="scene"></div>
  <div id="sparks"></div>

  <div class="box">
    <h1>Kalkulator <span>Bleach</span></h1>
    <p class="lokasi" id="lokasi"></p>

    <div class="layar">
      <div id="riwayat"></div>
      <div id="hasil">0</div>
    </div>

    <div class="grid">
      <button class="hapus" data-aksi="ac">AC</button>
      <button class="hapus" data-aksi="del">DEL</button>
      <button class="op" data-op="%">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-n="7">7</button>
      <button data-n="8">8</button>
      <button data-n="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-n="4">4</button>
      <button data-n="5">5</button>
      <button data-n="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-n="1">1</button>
      <button data-n="2">2</button>
      <button data-n="3">3</button>
      <button class="op" data-op="+">+</button>

      <button data-n="0">0</button>
      <button data-n=".">.</button>
      <button class="sama" data-aksi="sama">=</button>
    </div>
    <p class="pesan" id="pesan">Bisa juga pakai keyboard</p>
  </div>

  <script>
    // ===== TEMA LATAR (ganti tiap hitungan selesai) =====
    const tema = [
      { nama: "Senja Karakura", kanji: "代行", g: "linear-gradient(to top,#ff7b3d,#c2410c 40%,#3b1d5e 100%)", orb: "radial-gradient(circle,#fff3c4 0%,#ffd27a 60%,#ff9a3c 100%)", glow: "#ffb347", city: "#1a0a12", accent: "#ff6a00", spark: "#ffcf8a" },
      { nama: "Malam Bersalju", kanji: "月", g: "linear-gradient(to top,#2a4a7a,#10234a 50%,#030818 100%)", orb: "radial-gradient(circle,#ffffff 0%,#dbeafe 70%,#a5c8ff 100%)", glow: "#bcd8ff", city: "#050b1a", accent: "#4da6ff", spark: "#d6e8ff" },
      { nama: "Hujan Sakura", kanji: "桜", g: "linear-gradient(to top,#ff9ec4,#a8326b 45%,#2a0b2e 100%)", orb: "radial-gradient(circle,#fff0f6 0%,#ffc2da 70%,#ff8fba 100%)", glow: "#ffb3d1", city: "#1f0720", accent: "#ff5c9e", spark: "#ffd0e3" },
      { nama: "Istana Es", kanji: "氷", g: "linear-gradient(to top,#b8ecff,#2a8fc7 45%,#062a4d 100%)", orb: "radial-gradient(circle,#ffffff 0%,#e0f7ff 70%,#9fe3ff 100%)", glow: "#aeeaff", city: "#04182e", accent: "#38d4ff", spark: "#ffffff" },
      { nama: "Soul Society", kanji: "死神", g: "linear-gradient(to top,#3b1d5e,#1a1040 45%,#050510 100%)", orb: "radial-gradient(circle,#fff6dc 0%,#fff1d0 70%,#ffe2a0 100%)", glow: "#fff1d0", city: "#000000", accent: "#a855f7", spark: "#e0c8ff" },
      { nama: "BANKAI!", kanji: "卍解", g: "linear-gradient(to top,#ff7b3d,#7a0b1b 45%,#2b0008 100%)", orb: "radial-gradient(circle,#fffbe0 0%,#ffe9b0 60%,#ffd400 100%)", glow: "#ffd400", city: "#1a0004", accent: "#ffd400", spark: "#ffe28a" }
    ];

    const kota = `<svg class="city" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" fill="CITYCOLOR">
      <rect x="0" y="270" width="1200" height="30"/>
      <path d="M90 270 V190 H130 V270 Z"/><path d="M70 195 Q110 185 150 195 L135 170 H85 Z"/><path d="M85 170 Q110 160 135 170 L125 150 H95 Z"/><path d="M95 150 L110 125 L125 150 Z"/>
      <path d="M200 270 V215 H420 V270 Z"/><path d="M180 220 Q310 195 440 220 L410 200 H210 Z"/>
      <path d="M520 270 V160 H580 V270 Z"/><path d="M495 165 Q550 150 605 165 L585 135 H515 Z"/><path d="M512 135 Q550 120 588 135 L575 108 H525 Z"/><path d="M525 108 Q550 95 575 108 L562 82 H538 Z"/><path d="M540 82 L550 50 L560 82 Z"/>
      <path d="M680 270 V220 H860 V270 Z"/><path d="M660 225 Q770 200 880 225 L850 205 H690 Z"/>
      <path d="M930 270 V185 H980 V270 Z"/><path d="M910 190 Q955 178 1000 190 L985 165 H925 Z"/><path d="M925 165 Q955 152 985 165 L975 140 H935 Z"/><path d="M938 140 L955 112 L972 140 Z"/>
      <path d="M1060 270 V225 H1200 V270 Z"/><path d="M1045 230 Q1130 208 1215 230 L1190 212 H1070 Z"/>
    </svg>`;

    const scene = document.getElementById("scene");
    const layers = tema.map(t => {
      const d = document.createElement("div");
      d.className = "layer";
      d.style.background = t.g;
      d.innerHTML =
        '<div class="kanji">' + t.kanji + '</div>' +
        '<div class="orb" style="background:' + t.orb + ';box-shadow:0 0 40px ' + t.glow + ',0 0 110px ' + t.glow + '"></div>' +
        kota.replace("CITYCOLOR", t.city);
      scene.appendChild(d);
      return d;
    });

    const sparks = document.getElementById("sparks");
    for (let n = 0; n < 35; n++) {
      const s = document.createElement("div");
      s.className = "spark";
      const size = 2 + Math.random() * 4;
      s.style.width = s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = (6 + Math.random() * 8) + "s";
      s.style.animationDelay = (Math.random() * 10) + "s";
      sparks.appendChild(s);
    }

    let idxTema = 0;
    function gantiTema(idx) {
      const t = tema[idx];
      layers.forEach((l, n) => l.classList.toggle("aktif", n === idx));
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--spark", t.spark);
      document.getElementById("lokasi").textContent = "// " + t.nama;
    }

    // ===== LOGIKA KALKULATOR =====
    const $ = id => document.getElementById(id);
    const simbol = { "*": "×", "/": "÷", "-": "−", "+": "+", "%": "%" };
    let angka = "0";      // angka yang sedang diketik
    let simpanan = null;  // angka sebelum operator
    let operator = null;
    let barusamadengan = false;

    function tampil() {
      $("hasil").textContent = angka;
      $("hasil").style.fontSize = angka.length > 10 ? "26px" : "40px";
      $("riwayat").textContent = (simpanan !== null && operator) ? simpanan + " " + simbol[operator] : "";
    }

    function hitung(a, b, op) {
      a = parseFloat(a); b = parseFloat(b);
      let r;
      if (op === "+") r = a + b;
      else if (op === "-") r = a - b;
      else if (op === "*") r = a * b;
      else if (op === "/") { if (b === 0) return null; r = a / b; }
      else if (op === "%") { if (b === 0) return null; r = a % b; }
      return String(parseFloat(r.toFixed(10)));
    }

    function pesan(teks) { $("pesan").textContent = teks; }

    function ketikAngka(n) {
      if (barusamadengan) { angka = "0"; barusamadengan = false; }
      if (n === "." && angka.includes(".")) return;
      if (angka.length >= 14) return;
      angka = (angka === "0" && n !== ".") ? n : angka + n;
      tampil();
    }

    function pilihOperator(op) {
      if (operator && !barusamadengan && simpanan !== null) {
        const r = hitung(simpanan, angka, operator);
        if (r === null) return error();
        simpanan = r;
      } else {
        simpanan = angka;
      }
      operator = op;
      angka = "0";
      barusamadengan = false;
      tampil();
    }

    function samaDengan() {
      if (simpanan === null || !operator) return;
      const r = hitung(simpanan, angka, operator);
      if (r === null) return error();
      $("riwayat").textContent = simpanan + " " + simbol[operator] + " " + angka + " =";
      angka = r;
      simpanan = null;
      operator = null;
      barusamadengan = true;
      $("hasil").textContent = angka;
      $("hasil").style.fontSize = angka.length > 10 ? "26px" : "40px";
      idxTema = (idxTema + 1) % tema.length;
      gantiTema(idxTema);
      pesan(idxTema === tema.length - 1 ? "BANKAI! Latar berubah ke mode terkuat" : "Tema: " + tema[idxTema].nama);
    }

    function error() {
      angka = "0"; simpanan = null; operator = null;
      tampil();
      $("hasil").textContent = "∞ ?!";
      pesan("Reiatsu tak terhingga! Bankai gagal dipakai, tekan AC");
    }

    function hapusSemua() {
      angka = "0"; simpanan = null; operator = null; barusamadengan = false;
      tampil(); pesan("Bisa juga pakai keyboard");
    }

    function hapusSatu() {
      if (barusamadengan) return;
      angka = angka.length > 1 ? angka.slice(0, -1) : "0";
      tampil();
    }

    document.querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        if (b.dataset.n !== undefined) ketikAngka(b.dataset.n);
        else if (b.dataset.op) pilihOperator(b.dataset.op);
        else if (b.dataset.aksi === "sama") samaDengan();
        else if (b.dataset.aksi === "ac") hapusSemua();
        else if (b.dataset.aksi === "del") hapusSatu();
      });
    });

    document.addEventListener("keydown", e => {
      if (/^[0-9.]$/.test(e.key)) ketikAngka(e.key);
      else if (["+", "-", "*", "/", "%"].includes(e.key)) pilihOperator(e.key);
      else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); samaDengan(); }
      else if (e.key === "Backspace") hapusSatu();
      else if (e.key === "Escape" || e.key.toLowerCase() === "c") hapusSemua();
    });

    gantiTema(0);
    tampil();
  </script>
</body>
</html>
